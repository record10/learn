  function initThemeToggle() {
    const toggle = document.getElementById('theme-toggle');
    if (!toggle) return;

    const html = document.documentElement;

    const setTheme = (theme) => {
      html.classList.toggle('dark', theme === 'dark');
      localStorage.setItem('theme', theme);
    };

    // Clone to remove old listeners
    const newToggle = toggle.cloneNode(true);
    toggle.parentNode.replaceChild(newToggle, toggle);

    newToggle.addEventListener('click', () => {
      const newTheme = html.classList.contains('dark') ? 'light' : 'dark';
      setTheme(newTheme);
    });
  }

  // Handle both initial load and View Transitions

  function initNav() {
    const loveCount = document.getElementById('love-count');
    const streakCount = document.getElementById('streak-count');
    const resetBtn = document.getElementById('reset-btn');

    // Read from localStorage directly (nanostores persistent format)
    const getProgress = () => {
      try {
        const completed = JSON.parse(localStorage.getItem('userProgress:completed') || '[]');
        const streak = parseInt(localStorage.getItem('userProgress:streak') || '3');
        return { completed, streak };
      } catch {
        return { completed: [], streak: 3 };
      }
    };

    // Update UI
    const updateUI = () => {
      const progress = getProgress();
      if (loveCount) {
        // Each activity is worth 50 love
        const score = progress.completed.length * 50;
        loveCount.textContent = score.toString();
      }
      if (streakCount) {
        streakCount.textContent = progress.streak.toString();
      }
    };

    // Initial update
    updateUI();

    // Listen for storage changes (when other tabs or scripts update)
    window.addEventListener('storage', updateUI);

    // Also update on custom event (when activities are completed in the same tab)
    window.addEventListener('progress-updated', updateUI);

    // Reset Logic - clone to remove old listeners
    if (resetBtn) {
      const newResetBtn = resetBtn.cloneNode(true);
      resetBtn.parentNode.replaceChild(newResetBtn, resetBtn);

      newResetBtn.addEventListener('click', () => {
        if (confirm('Are you sure you want to reset all progress? This cannot be undone.')) {
          localStorage.setItem('userProgress:completed', '[]');
          localStorage.setItem('userProgress:streak', '3');
          localStorage.setItem('userProgress:unlocked', '["colors","colors-flashcards"]');
          window.location.reload();
        }
      });
    }
  }

  // Handle both initial load and View Transitions
  document.addEventListener('DOMContentLoaded', initNav);
  document.addEventListener('astro:page-load', initNav);
